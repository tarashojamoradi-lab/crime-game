<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deadwood — Final Verdict</title>

<style>

/* =====================================================
   FONTS
===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap');


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #080605;
    color: #ead8b5;
    font-family: "Special Elite", monospace;
}


/* =====================================================
   MAIN SCENE
===================================================== */

.scene {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background-image:
        linear-gradient(
            rgba(5, 3, 2, 0.12),
            rgba(5, 3, 2, 0.48)
        ),
        url("background.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    transition:
        filter 1.5s ease,
        opacity 1.5s ease;

    overflow: hidden;

    z-index: 1;
}


/* =====================================================
   DARKNESS WHEN CORRECT
===================================================== */

.scene.dark {

    filter:
        brightness(0.08)
        contrast(1.15);

}


/* =====================================================
   VIGNETTE
===================================================== */

.scene::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.30) 65%,
            rgba(0,0,0,.88) 100%
        );

    z-index: 2;
}


/* =====================================================
   OLD FILM GRAIN
===================================================== */

.grain {

    position: absolute;

    inset: -50%;

    width: 200%;
    height: 200%;

    opacity: .07;

    background-image:

        repeating-radial-gradient(
            circle at 0 0,
            transparent 0,
            rgba(255,255,255,.18) 1px,
            transparent 2px
        );

    animation:
        grainMove .18s steps(2) infinite;

    pointer-events: none;

    z-index: 20;
}

@keyframes grainMove {

    0% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(-2%,1%);
    }

    50% {
        transform: translate(1%,-2%);
    }

    75% {
        transform: translate(2%,2%);
    }

    100% {
        transform: translate(-1%,-1%);
    }
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: absolute;

    top: 24px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    text-align: center;

    color: #d7c09a;

    text-shadow:

        0 2px 5px #000,

        0 0 15px rgba(0,0,0,.9);

    transition: opacity 1s ease;
}

.header .location {

    font-family: "Rye", serif;

    font-size:
        clamp(13px, 2vw, 21px);

    letter-spacing: 4px;
}

.header .year {

    margin-top: 5px;

    font-size: 9px;

    letter-spacing: 4px;

    opacity: .65;
}


/* =====================================================
   ANSWER AREA
===================================================== */

.verdict-panel {

    position: absolute;

    z-index: 10;

    width: min(430px, 75vw);

    left: 50%;

    top: 69%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    transition:

        opacity .8s ease,

        transform .8s ease;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    font-family: "Rye", serif;

    font-size:
        clamp(19px, 4vw, 34px);

    letter-spacing: 2px;

    color: #291a11;

    margin-bottom: 18px;

    text-shadow:
        0 1px rgba(255,255,255,.3);
}


/* =====================================================
   INPUT
===================================================== */

.input-group {

    width: 100%;

    margin: 9px auto;

    text-align: left;
}

.input-label {

    display: block;

    margin:

        0 0 5px 7px;

    color: #2d1c12;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 1px;
}

.input-box {

    width: 100%;

    height: 44px;

    padding: 0 14px;

    border:

        1px solid
        rgba(67,39,22,.75);

    border-radius: 2px;

    outline: none;

    background:

        linear-gradient(
            rgba(246,227,190,.91),
            rgba(214,184,136,.91)
        );

    color: #21140d;

    font-family:
        "Special Elite",
        monospace;

    font-size: 16px;

    text-align: center;

    box-shadow:

        inset 0 0 12px
        rgba(50,28,12,.25),

        0 3px 8px
        rgba(0,0,0,.5);

    transition: .25s;
}

.input-box::placeholder {

    color: #604735;

    opacity: .72;
}

.input-box:focus {

    background: #ead6b0;

    box-shadow:

        inset 0 0 14px
        rgba(60,30,10,.25),

        0 0 0 2px
        rgba(91,38,27,.35);
}


/* =====================================================
   SUBMIT BUTTON
===================================================== */

.submit-btn {

    width: 100%;

    height: 51px;

    margin-top: 16px;

    border:

        1px solid
        #6b3b2d;

    background:

        linear-gradient(
            #3e2018,
            #24100c
        );

    color: #e6d0a6;

    font-family:
        "Rye",
        serif;

    font-size: 14px;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:

        0 5px 13px
        rgba(0,0,0,.65),

        inset 0 0 10px
        rgba(0,0,0,.7);

    transition: .25s;
}

.submit-btn:hover {

    background:

        linear-gradient(
            #54291e,
            #2b120e
        );

    transform:
        translateY(-2px);

    box-shadow:

        0 7px 18px
        rgba(0,0,0,.75),

        0 0 15px
        rgba(100,40,28,.25);
}

.submit-btn:active {

    transform:
        translateY(1px);
}


/* =====================================================
   WARNING
===================================================== */

.warning {

    margin-top: 9px;

    font-size: 8px;

    letter-spacing: 1px;

    color: #3c261a;

    opacity: .75;
}


/* =====================================================
   WRONG ANSWER MESSAGE
===================================================== */

.wrong-message {

    position: fixed;

    left: 50%;

    bottom: 25px;

    transform:
        translateX(-50%);

    z-index: 50;

    color: #9b382c;

    font-family:
        "Special Elite",
        monospace;

    font-size: 12px;

    letter-spacing: 1px;

    opacity: 0;

    pointer-events: none;

    transition: opacity .3s ease;

    text-shadow:
        0 2px 4px #000;
}

.wrong-message.show {

    opacity: 1;
}


/* =====================================================
   WRONG SHAKE
===================================================== */

.shake {

    animation:
        shake .35s ease;
}

@keyframes shake {

    0% {
        transform:
            translate(-50%, -50%);
    }

    20% {
        transform:
            translate(calc(-50% - 8px), -50%);
    }

    40% {
        transform:
            translate(calc(-50% + 8px), -50%);
    }

    60% {
        transform:
            translate(calc(-50% - 5px), -50%);
    }

    80% {
        transform:
            translate(calc(-50% + 5px), -50%);
    }

    100% {
        transform:
            translate(-50%, -50%);
    }
}


/* =====================================================
   BLACKOUT
===================================================== */

.blackout {

    position: fixed;

    inset: 0;

    z-index: 100;

    background: #000;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 1.4s ease;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;
}

.blackout.active {

    opacity: 1;

    visibility: visible;
}


/* =====================================================
   MAN VOICE TEXT
===================================================== */

.whisper {

    color: #cdbb9a;

    font-family:
        "Special Elite",
        monospace;

    font-size:
        clamp(19px, 4vw, 31px);

    letter-spacing: 2px;

    opacity: 0;

    transform:
        translateY(8px);

    transition:

        opacity 1.3s ease,

        transform 1.3s ease;

    text-shadow:

        0 0 20px
        rgba(255,255,255,.12);
}

.whisper.show {

    opacity: 1;

    transform:
        translateY(0);
}


/* =====================================================
   FINAL RESULT
===================================================== */

.result {

    position: fixed;

    inset: 0;

    z-index: 120;

    background:

        radial-gradient(
            ellipse at center,
            #21130e,
            #080504 70%
        );

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 1s ease;
}

.result.show {

    opacity: 1;

    visibility: visible;
}

.result h1 {

    font-family:
        "Rye",
        serif;

    font-size:
        clamp(35px, 9vw, 72px);

    color: #a33a2c;

    letter-spacing: 4px;

    transform:
        rotate(-4deg);

    border:
        4px solid #8d3025;

    padding:
        10px 25px;

    text-shadow:
        2px 2px 0 #35130f;

    box-shadow:

        0 0 0 2px
        rgba(141,48,37,.25),

        0 0 30px
        rgba(0,0,0,.8);
}

.result p {

    margin-top: 28px;

    padding: 0 25px;

    max-width: 600px;

    color: #cdbb9d;

    font-size: 14px;

    line-height: 2;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .header {

        top: 13px;
    }

    .header .location {

        font-size: 11px;

        letter-spacing: 2px;
    }

    .header .year {

        font-size: 7px;

        letter-spacing: 2px;
    }

    .verdict-panel {

        width: 72vw;

        top: 69%;
    }

    .title {

        font-size: 18px;

        margin-bottom: 12px;
    }

    .input-label {

        font-size: 9px;
    }

    .input-box {

        height: 38px;

        font-size: 14px;
    }

    .submit-btn {

        height: 43px;

        font-size: 11px;
    }

    .warning {

        font-size: 6px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     SCENE
===================================================== -->

<div
    class="scene"
    id="scene"
>

    <div class="grain"></div>


    <!-- HEADER -->

    <div class="header">

        <div class="location">
            DEADWOOD SHERIFF'S OFFICE
        </div>

        <div class="year">
            DEADWOOD • DAKOTA TERRITORY • 1887
        </div>

    </div>


    <!-- =================================================
         VERDICT FORM
    ================================================= -->

    <div
        class="verdict-panel"
        id="verdictPanel"
    >

        <div class="title">
            WHO DID IT?
        </div>


        <!-- KILLER -->

        <div class="input-group">

            <label class="input-label">
                THE KILLER
            </label>

            <input
                id="killer"
                class="input-box"
                type="text"
                autocomplete="off"
                placeholder="نام قاتل را وارد کنید"
            >

        </div>


        <!-- ACCOMPLICE -->

        <div class="input-group">

            <label class="input-label">
                THE ACCOMPLICE
            </label>

            <input
                id="accomplice"
                class="input-box"
                type="text"
                autocomplete="off"
                placeholder="نام همدست را وارد کنید"
            >

        </div>


        <button
            class="submit-btn"
            id="submitBtn"
        >
            SUBMIT THE VERDICT
        </button>


        <div class="warning">
            YOUR VERDICT WILL BE RECORDED.
        </div>

    </div>

</div>


<!-- WRONG ANSWER -->

<div
    class="wrong-message"
    id="wrongMessage"
>
    THE VERDICT IS WRONG.
</div>


<!-- =====================================================
     BLACKOUT
===================================================== -->

<div
    class="blackout"
    id="blackout"
>

    <div
        class="whisper"
        id="whisper"
    >
        بالاخره فهمیدی...
    </div>

</div>


<!-- =====================================================
     FINAL RESULT
===================================================== -->

<div
    class="result"
    id="result"
>

    <h1>
        CASE CLOSED
    </h1>

    <p>
        نام‌ها ثبت شدند.<br>
        پرونده وارد مرحله‌ی نهایی شد.
    </p>

</div>


<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="gunSound"
    src="gan.mp3"
    preload="auto"
></audio>

<audio
    id="manVoice"
    src="mard.mp3"
    preload="auto"
></audio>


<script>

/* =====================================================
   CORRECT ANSWERS
===================================================== */

const CORRECT_KILLER = "لیوای تامپسون";

const CORRECT_ACCOMPLICE = "دین اشفورد";


/* =====================================================
   ELEMENTS
===================================================== */

const killerInput =
    document.getElementById("killer");

const accompliceInput =
    document.getElementById("accomplice");

const submitBtn =
    document.getElementById("submitBtn");

const gunSound =
    document.getElementById("gunSound");

const manVoice =
    document.getElementById("manVoice");

const scene =
    document.getElementById("scene");

const verdictPanel =
    document.getElementById("verdictPanel");

const blackout =
    document.getElementById("blackout");

const whisper =
    document.getElementById("whisper");

const result =
    document.getElementById("result");

const wrongMessage =
    document.getElementById("wrongMessage");


/* =====================================================
   NORMALIZE PERSIAN TEXT

   فاصله‌های اضافه، نیم‌فاصله و تفاوت حروف
   باعث اشتباه در جواب نشوند.
===================================================== */

function normalizeText(text) {

    return text
        .trim()

        .replace(/ي/g, "ی")
        .replace(/ى/g, "ی")

        .replace(/ك/g, "ک")

        .replace(/ۀ/g, "ه")
        .replace(/ة/g, "ه")

        .replace(/\u200c/g, "")

        .replace(/\s+/g, "")

        .toLowerCase();
}


/* =====================================================
   PLAY GUN
===================================================== */

function playGun() {

    gunSound.pause();

    gunSound.currentTime = 0;

    gunSound.volume = 1;

    gunSound.play().catch(() => {});

}


/* =====================================================
   WRONG ANSWER
===================================================== */

function wrongAnswer() {

    /* هر بار صدای شلیک */

    playGun();


    /* لرزش فرم */

    verdictPanel.classList.remove("shake");

    void verdictPanel.offsetWidth;

    verdictPanel.classList.add("shake");


    /* پیام کوتاه */

    wrongMessage.classList.remove("show");

    void wrongMessage.offsetWidth;

    wrongMessage.classList.add("show");


    setTimeout(() => {

        wrongMessage.classList.remove("show");

    }, 1300);

}


/* =====================================================
   CORRECT ANSWER
===================================================== */

function correctAnswer() {

    /* جلوگیری از چند بار اجرا */

    submitBtn.disabled = true;

    killerInput.disabled = true;

    accompliceInput.disabled = true;


    /* فرم آرام محو شود */

    verdictPanel.style.opacity = "0";


    /* چراغ / صحنه کم‌نور شود */

    setTimeout(() => {

        scene.classList.add("dark");

    }, 150);


    /* صفحه کاملاً تاریک شود */

    setTimeout(() => {

        blackout.classList.add("active");

    }, 800);


    /* صدای مرد */

    setTimeout(() => {

        manVoice.pause();

        manVoice.currentTime = 0;

        manVoice.volume = 1;

        manVoice.play().catch(() => {});


        whisper.classList.add("show");

    }, 1900);


    /*
       بعد از پایان جمله وارد نتیجه می‌شویم.
       این زمان را می‌توانی بر اساس طول mard.mp3 تغییر بدهی.
    */

    setTimeout(() => {

        result.classList.add("show");

    }, 4800);

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function submitVerdict() {

    const killer =
        normalizeText(killerInput.value);

    const accomplice =
        normalizeText(accompliceInput.value);


    /* اگر یکی از فیلدها خالی باشد */

    if (!killer || !accomplice) {

        wrongAnswer();

        return;
    }


    /* بررسی جواب */

    const killerCorrect =
        killer ===
        normalizeText(CORRECT_KILLER);

    const accompliceCorrect =
        accomplice ===
        normalizeText(CORRECT_ACCOMPLICE);


    /* هر دو درست */

    if (
        killerCorrect &&
        accompliceCorrect
    ) {

        correctAnswer();

    }

    /* هر چیزی غیر از جواب کامل */

    else {

        wrongAnswer();

    }

}


/* =====================================================
   BUTTON
===================================================== */

submitBtn.addEventListener(
    "click",
    submitVerdict
);


/* =====================================================
   ENTER KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !submitBtn.disabled
        ) {

            submitVerdict();

        }

    }
);

</script>

</body>
</html>
