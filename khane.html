<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>کابوس خاموش</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{touch-action:manipulation}

/* قاب دقیقاً با نسبت عکس اصلی ساخته شده؛ هیچ object-fit:cover و هیچ crop/zoom وجود ندارد. */
.stage{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  overflow:hidden;
}
.artboard{
  position:relative;
  width:min(100vw, calc(100dvh * 853 / 1844));
  height:min(100dvh, calc(100vw * 1844 / 853));
  aspect-ratio:853 / 1844;
  overflow:hidden;
}
.house{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  object-fit:fill;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

/* در دقیقاً بر اساس مختصات تصویر اصلی قرار گرفته است. */
.door-hit{
  position:absolute;
  left:32.59%;
  top:33.08%;
  width:34.94%;
  height:23.86%;
  z-index:5;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transform-origin:3% 50%;
  perspective:900px;
}
.door{
  width:100%;
  height:100%;
  display:block;
  object-fit:fill;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

/* فضای تاریک پشت در فقط هنگام باز شدن ظاهر می‌شود؛ تصویر خانه قبل از کلیک دست‌نخورده است. */
.doorway{
  position:absolute;
  left:33.0%;
  top:33.2%;
  width:34.0%;
  height:23.3%;
  z-index:4;
  opacity:0;
  background:
    radial-gradient(ellipse at 50% 45%,#17130e 0%,#080706 48%,#000 100%);
  transition:opacity .55s ease;
  pointer-events:none;
}
.opening .doorway{opacity:1}

.door-hit.open{
  transform:perspective(900px) rotateY(-68deg);
  transition:transform 1.45s cubic-bezier(.18,.72,.16,1);
}

.screen-black{
  position:absolute;
  inset:0;
  z-index:20;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.1s ease;
}
.screen-black.show{opacity:1}
</style>
</head>
<body>
<div class="stage">
  <div class="artboard" id="artboard">
    <img class="housee" src="housee.png" alt="" draggable="false">

    <div class="doorway" id="doorway"></div>

    <div class="door-hit" id="doorHit" role="button" tabindex="0" aria-label="باز کردن در">
      <img class="door" src="door.png" alt="" draggable="false">
    </div>

    <div class="screen-black" id="screenBlack"></div>
  </div>
</div>

<!-- اگر این دو فایل را کنار index.html بگذاری، صدای واقعی خودشان پخش می‌شود. -->
<audio id="lockAudio" src="lock.mp3" preload="auto"></audio>
<audio id="creakAudio" src="door_creak.mp3" preload="auto"></audio>

<script>
const doorHit=document.getElementById('doorHit');
const doorway=document.getElementById('doorway');
const screenBlack=document.getElementById('screenBlack');
const lockAudio=document.getElementById('lockAudio');
const creakAudio=document.getElementById('creakAudio');

let opened=false;
let audioCtx=null;

function unlockAudio(){
  try{
    audioCtx=audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}

/* fallback: اگر فایل mp3 وجود نداشته باشد، صدای کوتاه ساخته می‌شود. */
function fallbackLock(){
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type='square';
  o.frequency.setValueAtTime(1900,t);
  o.frequency.exponentialRampToValueAtTime(700,t+.075);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.22,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+.105);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t+.11);
}

function fallbackCreak(){
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  const filter=audioCtx.createBiquadFilter();
  o.type='sawtooth';
  o.frequency.setValueAtTime(95,t);
  o.frequency.exponentialRampToValueAtTime(43,t+1.35);
  filter.type='lowpass';
  filter.frequency.setValueAtTime(900,t);
  filter.frequency.exponentialRampToValueAtTime(260,t+1.35);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.12,t+.08);
  g.gain.setValueAtTime(.09,t+.55);
  g.gain.exponentialRampToValueAtTime(.0001,t+1.45);
  o.connect(filter).connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t+1.5);
}

async function playAudio(el,fallback){
  try{
    el.currentTime=0;
    await el.play();
  }catch(e){
    fallback();
  }
}

async function openDoor(){
  if(opened) return;
  opened=true;
  unlockAudio();

  /* هر دو صدا در همان gesture کاربر فعال می‌شوند. */
  playAudio(lockAudio,fallbackLock);

  setTimeout(()=>{
    doorway.classList.add('opening');
    doorHit.classList.add('open');
    playAudio(creakAudio,fallbackCreak);
  },180);

  setTimeout(()=>{
    screenBlack.classList.add('show');
  },1450);

  /* برای ورود به صفحه بعد، بعداً این خط را فعال کن:
     location.href='inside.html';
  */
}

doorHit.addEventListener('click',openDoor);
doorHit.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    openDoor();
  }
});
</script>
</body>
</html>
