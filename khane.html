<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کابوس خاموش</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#000;overflow-x:hidden}
body{touch-action:manipulation}
#scene{position:relative;width:100vw;min-height:100dvh;background:#000;overflow:hidden}
#house{display:block;width:100vw;height:auto;max-width:none;margin:0;user-select:none;-webkit-user-drag:none;pointer-events:none}
#door{position:absolute;z-index:5;cursor:pointer;transform-origin:left center;transition:transform 1.55s cubic-bezier(.22,.72,.16,1),filter 1.1s ease;-webkit-tap-highlight-color:transparent}
#door img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}
#blackout{position:fixed;inset:0;z-index:20;background:#000;opacity:0;pointer-events:none;transition:opacity 1.1s ease}
#blackout.on{opacity:1}
</style>
</head>
<body>
<main id="scene">
  <img id="housee" src="housee.png" alt="" draggable="false">
  <div id="door" role="button" tabindex="0" aria-label="باز کردن در">
    <img src="door.png" alt="" draggable="false">
  </div>
  <div id="blackout"></div>
</main>

<script>
/*
 house.png: 711x1536
 door.png: 792x1536

 محل در روی خود house.png اندازه‌گیری شده است.
 تصویر خانه با width:100vw و height:auto نمایش داده می‌شود،
 بنابراین هیچ cover/crop/zoom روی عکس خانه اعمال نمی‌شود.
*/
const HOUSE_W=711;
const DOOR_X=240;
const DOOR_Y=548;
const DOOR_W=232;
const DOOR_H=326;

const house=document.getElementById('house');
const door=document.getElementById('door');
const blackout=document.getElementById('blackout');

function placeDoor(){
  const scale=house.clientWidth/HOUSE_W;
  door.style.left=(DOOR_X*scale)+'px';
  door.style.top=(DOOR_Y*scale)+'px';
  door.style.width=(DOOR_W*scale)+'px';
  door.style.height=(DOOR_H*scale)+'px';
}
house.addEventListener('load',placeDoor);
window.addEventListener('resize',placeDoor);
if(house.complete) placeDoor();

let opened=false;
const lockSound=new Audio('lock.mp3');
const creakSound=new Audio('door-creak.mp3');
lockSound.preload='auto';
creakSound.preload='auto';
lockSound.volume=.65;
creakSound.volume=.75;

/* آماده‌سازی صدا با اولین لمس، چون مرورگر موبایل autoplay را محدود می‌کند. */
function unlockAudio(){
  [lockSound,creakSound].forEach(a=>{
    try{
      const volume=a.volume;
      a.volume=0;
      const p=a.play();
      if(p){
        p.then(()=>{
          a.pause();
          a.currentTime=0;
          a.volume=volume;
        }).catch(()=>{a.volume=volume});
      }
    }catch(e){}
  });
}
document.addEventListener('pointerdown',unlockAudio,{once:true,passive:true});

function openDoor(){
  if(opened)return;
  opened=true;
  try{lockSound.currentTime=0;lockSound.play().catch(()=>{});}catch(e){}
  setTimeout(()=>{
    try{creakSound.currentTime=0;creakSound.play().catch(()=>{});}catch(e){}
    door.style.transform='perspective(900px) rotateY(-62deg)';
    door.style.filter='brightness(.72)';
  },230);
  setTimeout(()=>blackout.classList.add('on'),1900);
}
door.addEventListener('click',openDoor);
door.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();openDoor();}
});
</script>
</body>
</html>
