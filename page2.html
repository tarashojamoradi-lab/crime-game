<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>کابوس خاموش | مدرک تصویری</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:#050403;color:#e8dfcf}
.bg{position:fixed;inset:0;background:radial-gradient(circle,#3a2a1b,#050403 75%);z-index:0}
.v{position:fixed;inset:0;z-index:20;pointer-events:none;background:radial-gradient(circle,transparent 20%,rgba(0,0,0,.8) 100%)}
.stage{position:relative;z-index:5;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.album{width:min(1050px,96vw);height:min(94vh,900px);background:linear-gradient(145deg,#21180f,#090705);border:1px solid rgba(185,150,91,.4);box-shadow:0 25px 90px #000;padding:20px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;border-bottom:1px solid rgba(180,145,88,.22);padding-bottom:12px;color:#9e927e;font-size:11px}
h1{text-align:center;font-weight:normal;font-size:28px;letter-spacing:4px;color:#e6d7bc;margin:14px 0 4px}
.sub{text-align:center;color:#7f7261;font-size:11px;margin-bottom:12px}
.page{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#6d5437;border:8px solid #453321;padding:12px;box-shadow:inset 0 0 35px #000}
.card{position:relative;height:100%;max-height:750px;aspect-ratio:3/4;max-width:90vw;perspective:1200px;transition:transform .6s}
.face{position:absolute;inset:0;backface-visibility:hidden;background:#c5ab82;padding:8px;box-shadow:0 12px 30px #000}
.face.back{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;background:#bba078}
.card.flipped{transform:rotateY(180deg)}
.photo{width:100%;height:100%;object-fit:cover;display:block}
.hot{position:absolute;width:34px;height:34px;border-radius:50%;border:1px solid #e0c187;background:rgba(20,12,6,.45);box-shadow:0 0 0 6px rgba(210,170,100,.08),0 0 18px rgba(220,180,105,.35);cursor:pointer}
.hot:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#d6b77d}
.ring{right:41%;bottom:26%}.masked{right:15%;top:28%}.neck{left:47%;top:48%}
.backtext{font-family:"Times New Roman",serif;text-align:center;color:#302319;font-size:22px;line-height:2.25;padding:25px}
.date{display:block;font-size:16px;letter-spacing:5px;margin-bottom:30px}
.controls{text-align:center;margin-top:10px}.btn{border:1px solid rgba(185,150,91,.55);background:linear-gradient(#674f2f,#2d2216);color:#d9c9ad;padding:10px 22px;cursor:pointer;font-family:Tahoma}
.foot{display:flex;justify-content:space-between;border-top:1px solid rgba(180,145,88,.16);padding-top:8px;margin-top:9px;color:#62594d;font-size:9px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:.2s;padding:20px}
.modal.on{visibility:visible;opacity:1}.box{width:min(430px,90vw);background:#120d08;border:1px solid rgba(185,150,91,.5);padding:28px;text-align:center;box-shadow:0 25px 80px #000}
.box h2{font-weight:normal;color:#e6d7bc;margin-bottom:12px;font-size:19px}.box p{color:#a99a86;font-size:13px;line-height:2}.close{margin-top:18px}
@media(max-width:600px){.album{height:96vh;padding:14px 10px}.top{font-size:8px}h1{font-size:21px}.sub{font-size:9px}.page{border-width:5px;padding:7px}.card{height:100%;width:auto}.backtext{font-size:17px}.hot{width:28px;height:28px}.hot:after{inset:7px}.foot{font-size:7px}}

@media (max-width: 600px){
  .stage{padding:12px 8px 20px}
  .album{padding:12px 8px}
  .card{width:min(94vw,560px);height:auto;aspect-ratio:3/4}
  .photo{width:100%;height:100%;object-fit:contain}
  .controls{margin-top:12px}
}

.back .date{font-family:Georgia,"Times New Roman",serif;letter-spacing:1px}
.back{font-family:Georgia,"Times New Roman",serif}
.hot.masked{left:88%!important;right:auto!important;top:43%!important;transform:translate(-50%,-50%)!important}

@media (max-width:600px){
  body{overflow-x:hidden}
  .stage{min-height:100dvh;padding:10px 6px 18px}
  .album{width:100%;padding:8px 4px}
  .card{width:min(94vw,560px);height:auto;aspect-ratio:3/4;max-height:none}
  .photo{display:block;width:100%;height:100%;object-fit:contain}
}

.back{
  background:
    radial-gradient(circle at 20% 18%, rgba(120,82,35,.10), transparent 28%),
    radial-gradient(circle at 82% 76%, rgba(120,82,35,.08), transparent 30%),
    #e9d6ad;
  color:#4a3521;
  font-family:Georgia,"Times New Roman",serif;
}
.back .date{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(18px,4vw,26px);
  letter-spacing:1px;
}
.back .backtext{
  font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  font-size:clamp(18px,4.4vw,30px);
  line-height:1.9;
  max-width:82%;
  margin:auto;
  text-align:center;
}

.photo{border:0!important;outline:0!important;box-shadow:none!important}
@media (max-width:600px){
  .card{width:94vw!important;height:auto!important;aspect-ratio:3/4!important;max-height:none!important}
  .photo{width:100%!important;height:100%!important;object-fit:contain!important}
}
</style>
</head>
